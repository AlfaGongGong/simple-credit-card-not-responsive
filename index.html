<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Secure credit card checkout">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>CREDIT CARD CHECKOUT</title>
</head>

<body>

    <!-- Floating background particles -->
    <div class="bg-particles" aria-hidden="true">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="page-wrapper">
        <div class="checkout-container">

            <!-- Header -->
            <header class="checkout-header">
                <h1 class="checkout-title">
                    <span class="title-icon" aria-hidden="true">💳</span> Secure Payment
                </h1>
                <p class="checkout-subtitle">Your transaction is protected with 256-bit SSL encryption</p>
            </header>

            <!-- 3D Card Preview -->
            <div class="card-scene" id="card-scene" aria-hidden="true">
                <div class="card-3d" id="card-3d">

                    <!-- Front face -->
                    <div class="card-face card-front">
                        <div class="card-shine"></div>
                        <div class="card-front-top">
                            <div class="card-chip">
                                <svg viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
                                    <defs>
                                        <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
                                            <stop offset="0%" stop-color="#d4af37"/>
                                            <stop offset="40%" stop-color="#f7e98e"/>
                                            <stop offset="60%" stop-color="#d4af37"/>
                                            <stop offset="100%" stop-color="#b8960c"/>
                                        </linearGradient>
                                    </defs>
                                    <rect width="50" height="40" rx="5" fill="url(#chipGrad)"/>
                                    <rect x="19" y="0"  width="2" height="11" fill="rgba(0,0,0,.18)"/>
                                    <rect x="29" y="0"  width="2" height="11" fill="rgba(0,0,0,.18)"/>
                                    <rect x="19" y="29" width="2" height="11" fill="rgba(0,0,0,.18)"/>
                                    <rect x="29" y="29" width="2" height="11" fill="rgba(0,0,0,.18)"/>
                                    <rect x="0"  y="14" width="11" height="2"  fill="rgba(0,0,0,.18)"/>
                                    <rect x="0"  y="24" width="11" height="2"  fill="rgba(0,0,0,.18)"/>
                                    <rect x="39" y="14" width="11" height="2"  fill="rgba(0,0,0,.18)"/>
                                    <rect x="39" y="24" width="11" height="2"  fill="rgba(0,0,0,.18)"/>
                                    <rect x="11" y="11" width="28" height="18" rx="3" fill="rgba(0,0,0,.12)"/>
                                </svg>
                            </div>
                            <div class="card-type-logo" id="card-type-logo"></div>
                        </div>

                        <div class="card-number-display" id="card-number-display">
                            <span class="num-group">••••</span>
                            <span class="num-group">••••</span>
                            <span class="num-group">••••</span>
                            <span class="num-group">••••</span>
                        </div>

                        <div class="card-bottom">
                            <div class="card-holder">
                                <span class="card-label">Card Holder</span>
                                <span class="card-value" id="display-name">FULL NAME</span>
                            </div>
                            <div class="card-expiry">
                                <span class="card-label">Expires</span>
                                <span class="card-value" id="display-expiry">MM/YY</span>
                            </div>
                        </div>
                    </div>

                    <!-- Back face -->
                    <div class="card-face card-back">
                        <div class="card-magnetic-strip"></div>
                        <div class="card-signature-area">
                            <div class="signature-strip">
                                <span class="signature-text">AUTHORIZED SIGNATURE — NOT VALID UNLESS SIGNED</span>
                                <div class="cvv-box">
                                    <span class="cvv-label">CVV</span>
                                    <span class="cvv-value" id="display-cvv">•••</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-back-footer">
                            <svg class="card-back-logo" viewBox="0 0 175.7 53.9" xmlns="http://www.w3.org/2000/svg">
                                <path fill="rgba(255,255,255,.25)" d="M61.9 53.1l8.9-52.2h14.2l-8.9 52.2zm65.8-50.9c-2.8-1.1-7.2-2.2-12.7-2.2-14.1 0-24 7.1-24 17.2-.1 7.5 7.1 11.7 12.5 14.2 5.5 2.6 7.4 4.2 7.4 6.5 0 3.5-4.4 5.1-8.5 5.1-5.7 0-8.7-.8-13.4-2.7l-2-.9-2 11.7c3.3 1.5 9.5 2.7 15.9 2.8 15 0 24.7-7 24.8-17.8.1-5.9-3.7-10.5-11.9-14.2-5-2.4-8-4-8-6.5 0-2.2 2.6-4.5 8.1-4.5 4.7-.1 8 .9 10.6 2l1.3.6 1.9-11.3M164.2 1h-11c-3.4 0-6 .9-7.5 4.3l-21.1 47.8h14.9s2.4-6.4 3-7.8h18.2c.4 1.8 1.7 7.8 1.7 7.8h13.2l-11.4-52.1m-17.5 33.6c1.2-3 5.7-14.6 5.7-14.6-.1.1 1.2-3 1.9-5l1 4.5s2.7 12.5 3.3 15.1h-11.9zm-96.7-33.7l-14 35.6-1.5-7.2c-2.5-8.3-10.6-17.4-19.6-21.9l12.7 45.7h15.1l22.4-52.2h-15.1"/>
                                <path fill="rgba(247,166,0,.5)" d="M23.1.9h-22.9l-.2 1.1c17.9 4.3 29.7 14.8 34.6 27.3l-5-24c-.9-3.3-3.4-4.3-6.5-4.4"/>
                            </svg>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Payment form -->
            <form class="payment-form" id="payment-form" novalidate>

                <div class="form-group" id="group-name">
                    <label class="form-label" for="name_on_card">
                        <span aria-hidden="true">👤</span> Cardholder Name
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="name_on_card" class="form-input"
                               placeholder="Jane Smith"
                               autocomplete="cc-name" maxlength="26">
                        <div class="input-highlight" aria-hidden="true"></div>
                    </div>
                    <span class="field-error" id="error-name" role="alert"></span>
                </div>

                <div class="form-group" id="group-card-number">
                    <label class="form-label" for="card_number">
                        <span aria-hidden="true">💳</span> Card Number
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="card_number" class="form-input"
                               placeholder="0000 0000 0000 0000"
                               autocomplete="cc-number" maxlength="19" inputmode="numeric">
                        <div class="input-highlight" aria-hidden="true"></div>
                        <div class="card-type-badge" id="card-type-badge" aria-hidden="true"></div>
                    </div>
                    <span class="field-error" id="error-card" role="alert"></span>
                </div>

                <div class="form-row">
                    <div class="form-group" id="group-expiry">
                        <label class="form-label" for="expiry">
                            <span aria-hidden="true">📅</span> Expiry
                        </label>
                        <div class="input-wrapper">
                            <input type="text" id="expiry" class="form-input"
                                   placeholder="MM / YY"
                                   autocomplete="cc-exp" maxlength="7" inputmode="numeric">
                            <div class="input-highlight" aria-hidden="true"></div>
                        </div>
                        <span class="field-error" id="error-expiry" role="alert"></span>
                    </div>

                    <div class="form-group" id="group-cvv">
                        <label class="form-label" for="cvv">
                            <span aria-hidden="true">🔒</span> CVV
                            <button type="button" class="cvv-info-btn"
                                    title="3 or 4 digits on the back of your card"
                                    aria-label="What is CVV?">?</button>
                        </label>
                        <div class="input-wrapper">
                            <input type="password" id="cvv" class="form-input"
                                   placeholder="•••"
                                   autocomplete="cc-csc" maxlength="4" inputmode="numeric">
                            <div class="input-highlight" aria-hidden="true"></div>
                        </div>
                        <span class="field-error" id="error-cvv" role="alert"></span>
                    </div>
                </div>

                <button type="submit" class="pay-btn" id="pay-btn">
                    <span class="btn-content">
                        <span aria-hidden="true">🔐</span>
                        <span class="btn-text">Pay Now</span>
                    </span>
                    <span class="btn-loader" aria-hidden="true"></span>
                    <span class="btn-success" aria-hidden="true">✓ Payment Successful!</span>
                </button>

                <div class="security-badges" aria-label="Security information">
                    <span class="badge">🔒 SSL Secured</span>
                    <span class="badge">✓ PCI Compliant</span>
                    <span class="badge">🛡️ Fraud Protected</span>
                </div>

            </form>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
